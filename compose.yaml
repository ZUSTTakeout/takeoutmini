name: campus-food-street
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-${MYSQL_DATABASE:-campus_food}}
      MYSQL_USER: ${DATABASE_USER:-${MYSQL_USER:-campus}}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-${MYSQL_PASSWORD:?请复制 .env.example 为 .env 并配置数据库密码}}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${DATABASE_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
  migrate:
    build:
      context: ./apps/api
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: mysql://${DATABASE_USER:-${MYSQL_USER:-campus}}:${DATABASE_PASSWORD:-${MYSQL_PASSWORD}}@mysql:3306/${DATABASE_NAME:-${MYSQL_DATABASE:-campus_food}}
    depends_on:
      mysql:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  api:
    build:
      context: ./apps/api
      target: runtime
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: mysql://${DATABASE_USER:-${MYSQL_USER:-campus}}:${DATABASE_PASSWORD:-${MYSQL_PASSWORD}}@mysql:3306/${DATABASE_NAME:-${MYSQL_DATABASE:-campus_food}}
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-campus-food-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-campus-food-miniapp}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  nginx:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  mysql_data:
